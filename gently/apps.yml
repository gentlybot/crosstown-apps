# Gently workspace runtime for the Crosstown web apps.
# Two Vite SPAs: the portal at / and the courier app (a Capacitor web build)
# at /courier/. Both call the API repo's routes (/api) on the same origin, so
# VITE_API_URL is the environment's own URL.

tools:
  - nodejs_22
  - pnpm

setup:
  - pnpm install

apps:
  portal:
    port: 5200
    routes:
      - path: /
    env:
      VITE_API_URL: "{{ gently.GENTLY_ENVIRONMENT_URL }}"
      VITE_ALLOWED_HOSTS: "{{ gently.GENTLY_DOMAIN }}"
    startup:
      - pnpm --filter portal dev
    health:
      - endpoint: /

  courier:
    port: 5300
    routes:
      - path: /courier
    env:
      VITE_API_URL: "{{ gently.GENTLY_ENVIRONMENT_URL }}"
      VITE_ALLOWED_HOSTS: "{{ gently.GENTLY_DOMAIN }}"
      VITE_BASE_PATH: /courier/
    startup:
      - pnpm --filter courier dev
    # Gently probes health endpoints without a trailing slash, and Vite answers
    # a bare base path (/courier) with a redirect, so probe a file instead.
    health:
      - endpoint: /courier/index.html
